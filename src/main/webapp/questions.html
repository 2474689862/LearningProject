<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>错题本 · AI 学习助手</title>
  <link rel="stylesheet" href="css/app.css">
  <link rel="stylesheet" href="vendor/katex/katex.min.css">
  <style>
    .modal-mask {
      position: fixed; inset: 0; background: rgba(16, 18, 34, .45); backdrop-filter: blur(2px);
      display: none; place-items: center; z-index: 100; padding: 20px;
    }
    .modal-mask.show { display: grid; }
    .modal {
      background: #fff; border-radius: 18px; width: 100%; max-width: 720px;
      max-height: 86vh; overflow: auto; padding: 26px; box-shadow: 0 24px 60px rgba(0, 0, 0, .25);
    }
    .modal .modal-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; margin-bottom: 16px; }
    .modal .modal-head h3 { font-size: 18px; line-height: 1.45; }
    .modal .section { margin-top: 16px; }
    .modal .section .k { color: var(--ink-3); font-size: 12px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; }
    .modal .section .v { margin-top: 4px; color: var(--ink-2); white-space: pre-wrap; }    .modal img { width: 100%; border-radius: 12px; margin-top: 8px; border: 1px solid var(--line); }
    .analyze-body { margin-top: 8px; white-space: pre-wrap; line-height: 1.8; color: var(--ink-2); }
  </style>
</head>
<body>
<header class="topbar">
  <div class="brand"><span class="logo">AI</span> 学习助手</div>
  <nav class="nav-links">
    <a href="home.html">概览</a>
    <a href="summary.html">学习总结</a>
    <a href="upload.html">上传错题</a>
    <a href="questions.html" class="active">错题本</a>
    <a href="ai.html">AI 助手</a>
    <a href="categories.html">分类管理</a>
    <a href="settings.html">设置</a>
  </nav>
  <div class="user-area">
    <div class="avatar" data-username>U</div>
    <span data-username>同学</span>
    <button class="btn btn-sm btn-ghost" onclick="logout()">退出</button>
  </div>
</header>

<main class="page">
  <div class="page-head">
    <div>
      <h1>我的错题本</h1>
      <p class="sub" id="summary">按学科与知识点筛选，快速定位薄弱环节</p>
    </div>
    <a class="btn btn-primary" href="upload.html">＋ 上传错题</a>
  </div>

  <div class="card" style="margin-bottom:18px">
    <div class="row" style="grid-template-columns:1fr 1fr 1fr 1.4fr auto;align-items:end;gap:12px">
      <div class="field" style="margin:0">
        <label>学科</label>
        <select id="filter-subject"><option value="">全部学科</option></select>
      </div>
      <div class="field" style="margin:0">
        <label>知识点</label>
        <select id="filter-category"><option value="">全部知识点</option></select>
      </div>
      <div class="field" style="margin:0">
        <label>题型</label>
        <select id="filter-type">
          <option value="">全部题型</option>
          <option value="choice">选择题</option>
          <option value="judge">判断题</option>
          <option value="blank">填空题</option>
          <option value="short">简答题</option>
          <option value="essay">解答题</option>
          <option value="reading">阅读理解</option>
          <option value="experiment">实验题</option>
          <option value="writing">写作题</option>
          <option value="listening">听力题</option>
          <option value="translation">翻译题</option>
          <option value="calculation">计算题</option>
        </select>
      </div>
      <div class="field" style="margin:0">
        <label>关键字</label>
        <input type="text" id="filter-keyword" placeholder="搜索标题或题干">
      </div>
      <div style="display:flex;gap:8px">
        <button class="btn" type="button" id="reset-filter">重置</button>
        <button class="btn btn-primary" type="button" id="search-btn">搜索</button>
      </div>
    </div>
  </div>

  <div id="list"><div class="empty">加载中…</div></div>
  <div class="pager" id="pager"></div>
</main>

<div class="modal-mask" id="modal-mask">
  <div class="modal" id="modal"></div>
</div>

<script src="vendor/katex/katex.min.js"></script>
<script src="vendor/katex/auto-render.min.js"></script>
<script src="js/api.js"></script>
<script src="js/latex.js"></script>
<script src="js/qtype.js"></script>
<script src="js/ai-health.js"></script>
<script>
  (function () {
    let page = 1;
    const size = 8;
    let total = 0;
    let tree = [];
    const state = { subjectId: '', categoryId: '', keyword: '', type: '' };

    init();

    async function init() {
      try {
        await guard();
        const res = await Api.get('api/categoryTree.action');
        AiHealth.check();
        tree = res.data || [];
        const subjectFilter = document.getElementById('filter-subject');
        subjectFilter.innerHTML = '<option value="">全部学科</option>' + tree.map(function (s) {
          return '<option value="' + s.id + '">' + escapeHtml(s.name) + '</option>';
        }).join('');

        const qid = new URLSearchParams(location.search).get('id');
        if (qid) {
          openDetail(qid);
        }
        load();
      } catch (e) { /* 已跳转 */ }
    }

    document.getElementById('filter-subject').addEventListener('change', function () {
      state.subjectId = this.value;
      state.categoryId = '';
      fillCategoryFilter();
      page = 1;
      load();
    });
    document.getElementById('filter-category').addEventListener('change', function () {
      state.categoryId = this.value;
      page = 1;
      load();
    });
    document.getElementById('filter-type').addEventListener('change', function () {
      state.type = this.value;
      page = 1;
      load();
    });
    document.getElementById('filter-keyword').addEventListener('keydown', function (e) {
      if (e.key === 'Enter') doSearch();
    });
    document.getElementById('search-btn').addEventListener('click', doSearch);
    document.getElementById('reset-filter').addEventListener('click', function () {
      state.subjectId = '';
      state.categoryId = '';
      state.keyword = '';
      state.type = '';
      document.getElementById('filter-subject').value = '';
      document.getElementById('filter-keyword').value = '';
      document.getElementById('filter-type').value = '';
      fillCategoryFilter();
      page = 1;
      load();
    });

    function doSearch() {
      state.keyword = document.getElementById('filter-keyword').value.trim();
      page = 1;
      load();
    }

    function fillCategoryFilter() {
      const sid = Number(state.subjectId);
      const subject = tree.find(s => s.id === sid);
      const cats = subject ? subject.categories : [];
      document.getElementById('filter-category').innerHTML = '<option value="">全部知识点</option>'
        + cats.map(c => '<option value="' + c.id + '">' + escapeHtml(c.name) + '</option>').join('');
    }

    async function load() {
      const box = document.getElementById('list');
      try {
        const res = await Api.get('api/questions.action', {
          page: page, size: size, subjectId: state.subjectId,
          categoryId: state.categoryId, keyword: state.keyword, type: state.type
        });
        total = res.data.total;
        const list = res.data.list || [];
        document.getElementById('summary').textContent = '共 ' + total + ' 道错题，当前第 ' + page + ' 页';
        if (!list.length) {
          box.innerHTML = '<div class="card"><div class="empty"><div class="big">🔍</div>没有符合条件的错题</div></div>';
          document.getElementById('pager').innerHTML = '';
          return;
        }
        box.innerHTML = '<div class="qlist">' + list.map(renderItem).join('') + '</div>';
        box.querySelectorAll('[data-detail]').forEach(function (el) {
          el.addEventListener('click', function () { openDetail(el.dataset.detail); });
        });
        box.querySelectorAll('[data-analyze]').forEach(function (el) {
          el.addEventListener('click', function () { openDetail(el.dataset.analyze, true); });
        });
        box.querySelectorAll('[data-del]').forEach(function (el) {
          el.addEventListener('click', function () { remove(el.dataset.del); });
        });
        box.querySelectorAll('[data-edit]').forEach(function (el) {
          el.addEventListener('click', function () { openEdit(el.dataset.edit); });
        });
        renderPager();
      } catch (e) {
        box.innerHTML = '<div class="card"><div class="empty">' + escapeHtml(e.message) + '</div></div>';
      }
    }

    function renderItem(q) {
      const diff = q.difficulty === 1 ? '<span class="tag green">简单</span>'
        : q.difficulty === 3 ? '<span class="tag red">困难</span>' : '<span class="tag orange">中等</span>';
      const thumb = q.imagePath
        ? '<div class="thumb"><img src="' + escapeHtml(Api.url(q.imagePath)) + '" alt="题目图片"></div>'
        : '<div class="thumb">📄</div>';
      return '<article class="qitem">' + thumb
        + '<div>'
        + '<div class="meta"><span class="tag blue">' + QTypes.label(q.type) + '</span>'
        + '<span class="tag">' + escapeHtml(q.subjectName) + '</span>'
        + (q.categoryName ? '<span class="tag gray">' + escapeHtml(q.categoryName) + '</span>' : '<span class="tag gray">未分类</span>')
        + diff + '</div>'
        + '<h4>' + escapeHtml(q.title) + '</h4>'
        + '<div class="content">' + (escapeHtml(q.content) || '（无题干文字，可查看图片）') + '</div>'
        + '<div class="foot"><span>' + formatDate(q.createdAt) + (q.source ? ' · ' + escapeHtml(q.source) : '') + '</span>'
        + '<span style="display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end">'
        + '<button class="btn btn-sm" data-detail="' + q.id + '">查看</button>'
        + '<button class="btn btn-sm" data-edit="' + q.id + '">编辑</button>'
        + '<button class="btn btn-sm btn-primary" data-analyze="' + q.id + '">AI 分析</button>'
        + '<button class="btn btn-sm btn-danger" data-del="' + q.id + '">删除</button>'
        + '</span></div>'
        + '</div></article>';
    }

    function renderPager() {
      const pages = Math.max(1, Math.ceil(total / size));
      const pager = document.getElementById('pager');
      pager.innerHTML = '<button class="btn btn-sm" ' + (page <= 1 ? 'disabled' : '') + ' id="prev">上一页</button>'
        + '<span>' + page + ' / ' + pages + '</span>'
        + '<button class="btn btn-sm" ' + (page >= pages ? 'disabled' : '') + ' id="next">下一页</button>';
      const prev = document.getElementById('prev');
      const next = document.getElementById('next');
      if (prev) prev.addEventListener('click', function () { if (page > 1) { page--; load(); } });
      if (next) next.addEventListener('click', function () { if (page < pages) { page++; load(); } });
    }

    async function remove(id) {
      if (!confirm('确定删除这道错题吗？')) return;
      try {
        await Api.post('api/deleteQuestion.action', { id: id });
        toast('已删除', 'success');
        load();
      } catch (e) {
        toast(e.message, 'error');
      }
    }

    async function openDetail(id, autoAnalyze) {
      const mask = document.getElementById('modal-mask');
      const modal = document.getElementById('modal');
      try {
        const res = await Api.get('api/question.action', { id: id });
        const q = res.data;
        modal.innerHTML = '<div class="modal-head"><div>'
          + '<div class="meta" style="display:flex;gap:8px;margin-bottom:8px">'
          + '<span class="tag blue">' + QTypes.label(q.type) + '</span>'
          + '<span class="tag">' + escapeHtml(q.subjectName) + '</span>'
          + (q.categoryName ? '<span class="tag gray">' + escapeHtml(q.categoryName) + '</span>' : '')
          + '</div><h3>' + escapeHtml(q.title) + '</h3></div>'
          + '<button class="btn btn-sm" id="modal-close">关闭</button></div>'
          + (q.imagePath ? '<img src="' + escapeHtml(Api.url(q.imagePath)) + '" alt="题目图片">' : '')
          + detailBody(q)
          + '<div class="section"><div class="k">来源 / 时间</div><div class="v">'
          + (escapeHtml(q.source) || '未填写') + ' · ' + formatDate(q.createdAt) + '</div></div>'
          + '<div style="display:flex;gap:8px;margin-top:20px;flex-wrap:wrap">'
          + '<button class="btn btn-primary" type="button" id="modal-analyze">AI 分析这道题</button>'
          + '<button class="btn" type="button" id="modal-edit">编辑这道题</button>'
          + '</div><div id="analyze-box"></div>';
        // 题干/答案里的 LaTeX 交给 KaTeX 渲染
        Latex.renderBlocks(modal, '.section .v, .opt-view li');
        mask.classList.add('show');
        document.getElementById('modal-close').addEventListener('click', closeDetail);
        document.getElementById('modal-analyze').addEventListener('click', function () {
          runAnalyze(q.id, true);
        });
        document.getElementById('modal-edit').addEventListener('click', function () {
          openEdit(q.id);
        });
        if (autoAnalyze) runAnalyze(q.id, false);
      } catch (e) {
        toast(e.message, 'error');
      }
    }

    /** 编辑错题：复用弹窗容器，除图片外其余字段可改 */
    async function openEdit(id) {
      const mask = document.getElementById('modal-mask');
      const modal = document.getElementById('modal');
      try {
        const res = await Api.get('api/question.action', { id: id });
        const q = res.data;
        modal.innerHTML = '<div class="modal-head"><div>'
          + '<div class="meta" style="display:flex;gap:8px;margin-bottom:8px">'
          + '<span class="tag">编辑错题</span>'
          + (q.imagePath ? '<span class="tag gray">图片保持不变</span>' : '')
          + '</div><h3>' + escapeHtml(q.title) + '</h3></div>'
          + '<button class="btn btn-sm" id="modal-close">关闭</button></div>'
          + '<div class="row">'
          + '<div class="field"><label>学科<span class="req">*</span></label>'
          + '<select id="edit-subject">' + tree.map(function (s) {
            return '<option value="' + s.id + '">' + escapeHtml(s.name) + '</option>';
          }).join('') + '</select></div>'
          + '<div class="field"><label>知识点</label><select id="edit-category"></select></div>'
          + '</div>'
          + '<div class="field"><label>标题<span class="req">*</span></label>'
          + '<input type="text" id="edit-title" maxlength="200" value="' + escapeHtml(q.title) + '"></div>'
          + '<div class="field"><label>题干</label>'
          + '<textarea id="edit-content" rows="3">' + escapeHtml(q.content) + '</textarea></div>'
          + '<div id="edit-qtype"></div>'
          + '<div class="field"><label>错因分析</label>'
          + '<textarea id="edit-analysis" rows="2">' + escapeHtml(q.analysis) + '</textarea></div>'
          + '<div class="row">'
          + '<div class="field"><label>来源</label>'
          + '<input type="text" id="edit-source" value="' + escapeHtml(q.source) + '"></div>'
          + '<div class="field"><label>难度</label><select id="edit-difficulty">'
          + '<option value="1">简单</option><option value="2">中等</option><option value="3">困难</option>'
          + '</select></div></div>'
          + (q.imagePath
            ? '<div class="field"><label>题目图片（暂不支持替换）</label>'
              + '<img src="' + escapeHtml(Api.url(q.imagePath)) + '" alt="题目图片" '
              + 'style="width:100%;max-width:340px;border-radius:12px;border:1px solid var(--line)"></div>'
            : '')
          + '<div style="display:flex;gap:8px;margin-top:8px;flex-wrap:wrap">'
          + '<button class="btn btn-primary" type="button" id="edit-save">保存修改</button>'
          + '<button class="btn" type="button" id="edit-cancel">取消</button>'
          + '<button class="btn btn-ghost" type="button" id="edit-detail">查看详情</button>'
          + '</div>';
        mask.classList.add('show');
        document.getElementById('edit-subject').value = String(q.subjectId);
        fillEditCategories(q.categoryId);
        document.getElementById('edit-difficulty').value = String(q.difficulty || 2);
        QTypes.mount(document.getElementById('edit-qtype'), {
          type: q.type,
          options: q.options,
          correctAnswer: q.correctAnswer,
          answer: q.answer
        });
        document.getElementById('edit-subject').addEventListener('change', function () {
          fillEditCategories(null);
        });
        document.getElementById('edit-save').addEventListener('click', function () { saveEdit(q.id); });
        document.getElementById('edit-cancel').addEventListener('click', closeDetail);
        document.getElementById('edit-detail').addEventListener('click', function () { openDetail(q.id); });
        document.getElementById('modal-close').addEventListener('click', closeDetail);
      } catch (e) {
        toast(e.message, 'error');
      }
    }

    /** 学科变化时重填知识点下拉 */
    function fillEditCategories(selectedId) {
      const selSubject = document.getElementById('edit-subject');
      const selCategory = document.getElementById('edit-category');
      if (!selSubject || !selCategory) return;
      const sid = Number(selSubject.value);
      const subject = tree.find(function (s) { return s.id === sid; });
      const cats = subject ? (subject.categories || []) : [];
      selCategory.innerHTML = '<option value="">未分类</option>' + cats.map(function (c) {
        return '<option value="' + c.id + '">' + escapeHtml(c.name) + '</option>';
      }).join('');
      if (selectedId) selCategory.value = String(selectedId);
    }

    async function saveEdit(id) {
      const btn = document.getElementById('edit-save');
      const qt = QTypes.get(document.getElementById('edit-qtype'));
      const payload = {
        id: id,
        subjectId: document.getElementById('edit-subject').value,
        categoryId: document.getElementById('edit-category').value || '',
        title: document.getElementById('edit-title').value.trim(),
        content: document.getElementById('edit-content').value.trim(),
        type: qt.type,
        options: qt.options,
        correctAnswer: qt.correctAnswer,
        answer: qt.answer,
        analysis: document.getElementById('edit-analysis').value.trim(),
        source: document.getElementById('edit-source').value.trim(),
        difficulty: document.getElementById('edit-difficulty').value
      };
      if (!payload.subjectId) { toast('请选择学科', 'error'); return; }
      if (!payload.title) { toast('请输入题目标题', 'error'); return; }
      if (qt.type === 'choice' && qt.optionsArray.length < 2) {
        toast('选择题至少需要填写 2 个选项', 'error');
        return;
      }
      btn.disabled = true;
      btn.textContent = '保存中…';
      try {
        await Api.post('api/updateQuestion.action', payload);
        toast('已保存修改', 'success');
        closeDetail();
        load();
      } catch (e) {
        toast(e.message, 'error');
      } finally {
        btn.disabled = false;
        btn.textContent = '保存修改';
      }
    }

    async function runAnalyze(id, fromButton) {
      const box = document.getElementById('analyze-box');
      const btn = document.getElementById('modal-analyze');
      if (!box || !btn) return;
      btn.disabled = true;
      btn.textContent = '分析中…';
      box.innerHTML = '<div class="section"><div class="k">AI 错题分析</div>'
        + '<div class="analyze-body" style="color:var(--ink-3)">模型正在分析题目，首次调用约需 20 秒…</div></div>';
      try {
        const res = await Api.post('api/aiAnalyze.action', { questionId: id });
        const d = res.data;
        box.innerHTML = '<div class="section"><div class="k">AI 错题分析'
          + (d.fallback ? '（本地规则）' : '') + '</div>'
          + '<div class="analyze-body">' + escapeHtml(d.text) + '</div>'
          + '<div class="hint" style="margin-top:8px">'
          + escapeHtml(d.providerLabel || '') + (d.model ? ' · ' + escapeHtml(d.model) : '')
          + ' · ' + ((d.elapsedMs || 0) / 1000).toFixed(1) + 's</div></div>';
      } catch (e) {
        box.innerHTML = '<div class="section"><div class="k">AI 错题分析</div>'
          + '<div class="analyze-body" style="color:var(--danger)">' + escapeHtml(e.message) + '</div></div>';
        if (fromButton) toast(e.message, 'error');
      } finally {
        btn.disabled = false;
        btn.textContent = '重新分析';
      }
    }

    /** 不同类型下「标准答案」区的标题 */
    var ANSWER_LABELS = {
      reading: '参考答案（按小问）',
      experiment: '实验结论 / 标准答案',
      writing: '评分要点 / 范文',
      listening: '听力原文与答案',
      translation: '参考译文',
      calculation: '参考答案 / 计算过程'
    };

    /** 详情正文：按题型决定展示选项、标准答案还是参考答案 */
    function detailBody(q) {
      var type = q.type || 'essay';
      var html = section('题干', q.content);
      if (type === 'choice') {
        var opts = parseOpts(q.options);
        if (opts.length) {
          var ans = (q.correctAnswer || '').trim().toUpperCase();
          html += '<div class="section"><div class="k">选项</div><ul class="opt-view">'
            + opts.map(function (o, i) {
              var letter = String.fromCharCode(65 + i);
              var right = ans === letter;
              return '<li' + (right ? ' class="right"' : '') + '>' + escapeHtml(o) + (right ? ' ✓' : '') + '</li>';
            }).join('') + '</ul></div>';
        }
        html += section('标准答案', q.correctAnswer);
      } else if (type === 'judge') {
        html += section('标准答案', q.correctAnswer);
      } else if (type === 'blank') {
        html += section('标准答案', q.correctAnswer);
      } else {
        html += section(ANSWER_LABELS[type] || '参考答案', q.correctAnswer);
      }
      html += section('我的作答', q.answer);
      html += section('错因分析', q.analysis);
      return html;
    }

    function parseOpts(raw) {
      if (!raw) return [];
      if (typeof raw === 'object') return Array.isArray(raw) ? raw : [];
      try {
        var arr = JSON.parse(raw);
        if (Array.isArray(arr)) return arr;
      } catch (e) { /* 旧数据按行拆分 */ }
      return String(raw).split(/\r?\n/).map(function (s) { return s.trim(); }).filter(Boolean);
    }

    function section(k, v) {
      if (!v) return '';
      return '<div class="section"><div class="k">' + k + '</div><div class="v">' + escapeHtml(v) + '</div></div>';
    }

    function closeDetail() {
      document.getElementById('modal-mask').classList.remove('show');
    }

    document.getElementById('modal-mask').addEventListener('click', function (e) {
      if (e.target === this) closeDetail();
    });
  })();
</script>
</body>
</html>
