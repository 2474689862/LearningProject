<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>学习总结 · AI 学习助手</title>
  <link rel="stylesheet" href="css/app.css">
  <style>
    .sum-text { white-space: pre-wrap; line-height: 1.85; color: var(--ink-2); font-size: 14px; }
    .sum-loading { display: flex; align-items: center; gap: 10px; color: var(--ink-3); font-size: 14px; padding: 10px 0; }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--primary, #4f46e5); animation: blink 1s infinite ease-in-out; }
    .dot:nth-child(2) { animation-delay: .2s; }
    .dot:nth-child(3) { animation-delay: .4s; }
    @keyframes blink { 0%, 100% { opacity: .25; } 50% { opacity: 1; } }
    .bar-row { margin-bottom: 12px; }
    .bar-row .bar-head { display: flex; justify-content: space-between; font-size: 13px; margin-bottom: 6px; }
    .bar { height: 8px; background: #f1f2f8; border-radius: 99px; overflow: hidden; }
    .bar > i { display: block; height: 100%; border-radius: 99px; background: linear-gradient(90deg, #4f46e5, #7c3aed); }
    .head-side { display: flex; flex-direction: column; align-items: flex-end; gap: 8px; }
    .saved-pill {
      display: inline-flex; align-items: center; gap: 6px;
      font-size: 12px; color: var(--ink-3);
      background: #f4f4fb; border: 1px solid var(--line); border-radius: 99px; padding: 5px 12px;
    }
    .saved-pill b { color: var(--ink-2); font-weight: 600; }
    .notice {
      display: none; gap: 10px; align-items: flex-start;
      margin-bottom: 16px; padding: 12px 16px; border-radius: 12px;
      background: #eef2ff; border: 1px solid #dfe3ff; color: #3730a3; font-size: 13px; line-height: 1.6;
    }
    .notice.show { display: flex; }
    .notice .ico { flex: none; font-size: 15px; }
  </style>
</head>
<body>
<header class="topbar">
  <div class="brand"><span class="logo">AI</span> 学习助手</div>
  <nav class="nav-links">
    <a href="home.html">概览</a>
    <a href="summary.html" class="active">学习总结</a>
    <a href="upload.html">上传错题</a>
    <a href="questions.html">错题本</a>
    <a href="ai.html">AI 助手</a>
    <a href="categories.html">分类管理</a>
    <a href="settings.html">设置</a>
  </nav>
  <div class="user-area">
    <div class="avatar" data-username>U</div>
    <span data-username>同学</span>
    <button class="btn btn-sm btn-ghost" onclick="logout()">退出</button>
  </div>
</header>

<main class="page">
  <div class="page-head">
    <div>
      <h1>学习总结</h1>
      <p class="sub">AI 会结合题量、学科、知识点与难度分布给出阶段复盘；结果会保存，下次进来直接看</p>
    </div>
    <div class="head-side">
      <span class="saved-pill" id="last-updated">尚未生成总结</span>
      <button class="btn btn-primary" id="gen-btn" type="button">生成总结</button>
    </div>
  </div>

  <div class="notice" id="summary-notice">
    <span class="ico">💾</span>
    <span id="notice-text"></span>
  </div>

  <section class="grid grid-4" style="margin-bottom:18px">
    <div class="stat accent">
      <div class="label">错题总数</div>
      <div class="value" id="stat-total">-</div>
      <div class="icon">📚</div>
    </div>
    <div class="stat">
      <div class="label">今日新增</div>
      <div class="value" id="stat-today">-</div>
      <div class="icon">✍️</div>
    </div>
    <div class="stat">
      <div class="label">上传图片</div>
      <div class="value" id="stat-uploads">-</div>
      <div class="icon">🖼️</div>
    </div>
    <div class="stat">
      <div class="label">知识点分类</div>
      <div class="value" id="stat-categories">-</div>
      <div class="icon">🗂️</div>
    </div>
  </section>

  <section class="grid grid-2" style="margin-bottom:18px">
    <div class="card">
      <div class="card-title"><h3>学科错题分布</h3><span class="hint">实时统计</span></div>
      <div id="subject-stats"><div class="empty">加载中…</div></div>
    </div>
    <div class="card">
      <div class="card-title"><h3>高频知识点</h3><span class="hint" id="top-cats-hint">Top 5</span></div>
      <div id="top-cats"><div class="empty">点击「生成总结」后展示</div></div>
    </div>
  </section>

  <section class="card" style="margin-bottom:18px">
    <div class="card-title"><h3>难度与录入趋势</h3><span class="hint">近 6 个月</span></div>
    <div class="grid grid-2">
      <div id="difficulty-box"><div class="empty">点击「生成总结」后展示</div></div>
      <div id="month-box"><div class="empty">点击「生成总结」后展示</div></div>
    </div>
  </section>

  <section class="card">
    <div class="card-title">
      <h3>AI 阶段总结</h3>
      <span class="hint" id="summary-meta"></span>
    </div>
    <div id="summary-body">
      <div class="empty">
        <div class="big">🗒️</div>
        还没有保存的总结。点击右上角「生成总结」，生成后会保存下来，下次进入直接显示。
      </div>
    </div>
    <div id="summary-actions" style="display:none;margin-top:16px">
      <button class="btn btn-sm" type="button" id="copy-btn">复制全文</button>
    </div>
  </section>
</main>

<script src="js/api.js"></script>
<script src="js/ai-health.js"></script>
<script>
  (function () {
    const genBtn = document.getElementById('gen-btn');
    const bodyEl = document.getElementById('summary-body');
    const metaEl = document.getElementById('summary-meta');
    const actionsEl = document.getElementById('summary-actions');
    const pillEl = document.getElementById('last-updated');
    const noticeEl = document.getElementById('summary-notice');
    const noticeTextEl = document.getElementById('notice-text');
    let lastText = '';
    let running = false;

    init();

    async function init() {
      try {
        await guard();
        AiHealth.check();
        await loadOverview();
        await loadSaved();
      } catch (e) { /* 已跳转登录 */ }
    }

    /* 顶部指标与学科分布始终看实时数据 */
    async function loadOverview() {
      try {
        const res = await Api.get('api/stats.action');
        const d = res.data || {};
        document.getElementById('stat-total').textContent = d.totalQuestions;
        document.getElementById('stat-today').textContent = d.todayQuestions;
        document.getElementById('stat-uploads').textContent = d.totalUploads;
        document.getElementById('stat-categories').textContent = d.totalCategories;
        renderBars('subject-stats', d.subjectStats || [], '道');
      } catch (e) {
        document.getElementById('subject-stats').innerHTML = '<div class="empty">' + escapeHtml(e.message) + '</div>';
      }
    }

    /* 进入页面：直接读已保存的总结，不调用模型 */
    async function loadSaved() {
      try {
        const res = await Api.get('api/summaryLatest.action');
        const d = res.data || {};
        if (!d.exists) {
          pillEl.textContent = '尚未生成总结';
          return;
        }
        applySaved(d);
      } catch (e) {
        metaEl.textContent = '读取已保存总结失败';
      }
    }

    function applySaved(d) {
      const stats = d.stats || {};
      renderBars('top-cats', stats.topCategories || [], '道');
      renderBars('difficulty-box', stats.difficultyStats || [], '道');
      renderBars('month-box', stats.monthStats || [], '道');

      const when = d.updatedAt || '之前';
      lastText = d.text || '';
      bodyEl.innerHTML = '<div class="sum-text">' + escapeHtml(lastText) + '</div>';
      metaEl.textContent = '保存于 ' + when
        + (d.providerLabel ? ' · ' + d.providerLabel : '')
        + (d.model ? ' · ' + d.model : '')
        + (d.fallback ? ' · 本地规则' : '');
      actionsEl.style.display = 'block';
      genBtn.textContent = '重新生成总结';
      pillEl.innerHTML = '上次生成 <b>' + escapeHtml(when) + '</b>';
      showNotice('这是 <b>' + escapeHtml(when) + '</b> 保存的总结，之后新增或修改的错题还没有纳入。'
        + '需要更新时点右上角「重新生成总结」。');
    }

    genBtn.addEventListener('click', async function () {
      if (running) return;
      running = true;
      genBtn.disabled = true;
      genBtn.textContent = '生成中…';
      metaEl.textContent = '';
      actionsEl.style.display = 'none';
      bodyEl.innerHTML = '<div class="sum-loading"><span class="dot"></span><span class="dot"></span><span class="dot"></span>'
        + '<span>正在读取题库并生成总结，首次调用约需 20 秒…</span></div>';
      try {
        const res = await Api.post('api/aiSummary.action', {});
        applyGenerated(res.data || {});
        toast('总结已生成并保存', 'success');
      } catch (e) {
        bodyEl.innerHTML = '<div class="empty" style="color:var(--danger)">' + escapeHtml(e.message) + '</div>';
        metaEl.textContent = '';
        genBtn.textContent = '重新生成总结';
        toast(e.message, 'error');
      } finally {
        running = false;
        genBtn.disabled = false;
      }
    });

    /* 刚生成：统计与图表都用最新数据 */
    function applyGenerated(d) {
      const stats = d.stats || {};
      document.getElementById('stat-total').textContent = stats.total || 0;
      document.getElementById('stat-today').textContent = stats.today || 0;
      document.getElementById('stat-uploads').textContent = stats.uploads || 0;
      renderBars('subject-stats', stats.subjectStats || [], '道');
      renderBars('top-cats', stats.topCategories || [], '道');
      renderBars('difficulty-box', stats.difficultyStats || [], '道');
      renderBars('month-box', stats.monthStats || [], '道');

      const now = new Date();
      const timeText = now.getFullYear() + '-' + pad(now.getMonth() + 1) + '-' + pad(now.getDate())
        + ' ' + pad(now.getHours()) + ':' + pad(now.getMinutes());

      if (!d.text) {
        lastText = '';
        bodyEl.innerHTML = '<div class="empty"><div class="big">🗒️</div>错题本还是空的，先去上传几道错题再来看总结</div>';
        actionsEl.style.display = 'none';
        metaEl.textContent = '';
        pillEl.textContent = '尚未生成总结';
        genBtn.textContent = '生成总结';
        return;
      }
      lastText = d.text;
      bodyEl.innerHTML = '<div class="sum-text">' + escapeHtml(d.text) + '</div>';
      metaEl.textContent = '刚刚生成 · ' + (d.providerLabel || '')
        + (d.model ? ' · ' + d.model : '')
        + (d.fallback ? ' · 本地规则' : '')
        + ' · ' + ((d.elapsedMs || 0) / 1000).toFixed(1) + 's';
      actionsEl.style.display = 'block';
      genBtn.textContent = '重新生成总结';
      pillEl.innerHTML = '上次生成 <b>' + timeText + '</b>';
      showNotice('总结已保存（' + timeText + '）。之后进入本页会直接显示这份内容，只有点击「重新生成总结」才会重新计算。');
    }

    function showNotice(html) {
      noticeTextEl.innerHTML = html;
      noticeEl.classList.add('show');
    }

    function pad(n) {
      return n < 10 ? '0' + n : String(n);
    }

    function renderBars(id, list, unit) {
      const box = document.getElementById(id);
      if (!box) return;
      if (!list.length) {
        box.innerHTML = '<div class="empty">暂无数据</div>';
        return;
      }
      const max = Math.max.apply(null, list.map(function (i) { return Number(i.count) || 0; }).concat([1]));
      box.innerHTML = list.map(function (item) {
        const n = Number(item.count) || 0;
        const pct = Math.max(3, Math.round(n / max * 100));
        return '<div class="bar-row"><div class="bar-head"><b>' + escapeHtml(item.name) + '</b>'
          + '<span style="color:var(--ink-3)">' + n + ' ' + unit + '</span></div>'
          + '<div class="bar"><i style="width:' + pct + '%"></i></div></div>';
      }).join('');
    }

    document.getElementById('copy-btn').addEventListener('click', function () {
      if (!lastText) return;
      const done = function () { toast('已复制到剪贴板', 'success'); };
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(lastText).then(done, function () { toast('复制失败，请手动选中', 'error'); });
        return;
      }
      const ta = document.createElement('textarea');
      ta.value = lastText;
      document.body.appendChild(ta);
      ta.select();
      try { document.execCommand('copy'); done(); } catch (e) { toast('复制失败，请手动选中', 'error'); }
      document.body.removeChild(ta);
    });
  })();
</script>
</body>
</html>
