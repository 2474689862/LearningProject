# ============ AI 能力配置 ============
# 优先级：环境变量 > 「设置」页写入的 t_setting > 本文件 > 代码默认值
# 设置页保存后立即生效，不需要重启 Tomcat
#
# provider 取值：
#   auto     —— 有云端 Key 用云端；本机 Ollama 可用则用 Ollama；否则走本地规则兜底
#   cloud    —— 强制使用云端 API（OpenAI 兼容，默认 DeepSeek）
#   ollama   —— 强制使用本机 Ollama（文字用 qwen3，识图用 qwen2.5vl）
#   local    —— 只用本地规则模板，不联网
#   deepseek —— 旧值，等价于 cloud
ai.provider=ollama

# ---- 云端 API（OpenAI 兼容；本项目主要适配 DeepSeek）----
# vendor 影响默认 Base URL / 默认模型与设置页的适配提示：
#   deepseek（最佳适配）/ custom（自定义兼容网关）/ openai / moonshot / zhipu / qwen / siliconflow（可选但受限）
#   anthropic / gemini / azure / bailian（未适配，不建议）
ai.cloud.vendor=deepseek
ai.cloud.baseUrl=https://api.deepseek.com/v1
ai.cloud.apiKey=
# DeepSeek 当前可用模型：deepseek-flash（快）/ deepseek-v4-pro（强）；旧账号可用 deepseek-chat
ai.cloud.model=deepseek-flash

# 兼容旧配置：ai.cloud.apiKey 为空时会回退读取下面的 Key
ai.deepseek.apiKey=

# ---- 本机 Ollama（默认端口 11434；需先安装 Ollama 并 pull 对应模型）----
ai.ollama.baseUrl=http://127.0.0.1:11434/v1

# 文字任务（解析、问答、总结、分类）使用 qwen3：中文与指令遵循优于 deepseek-r1
ai.ollama.textModel=qwen3:8b
# 图片识别任务（拍照/上传错题）使用多模态模型 qwen2.5vl
ai.ollama.visionModel=qwen2.5vl:7b
# 兼容旧配置：未单独配置 textModel / visionModel 时使用此模型
ai.ollama.model=qwen3:8b

# 同一时刻只加载一个模型：文字与识图切换时自动卸载另一个，释放显存
ai.ollama.singleModel=true
# 模型空闲常驻时间（Ollama keep_alive），切换模型时会用 keep_alive=0 立即卸载
ai.ollama.keepAlive=5m

# ---- 通用参数（8B 模型在笔记本显卡上单次解析约 10-40 秒，超时留足）----
ai.timeout.seconds=180
# qwen3 开启思考时输出较长，留足 token 避免答案被截断
ai.max.tokens=3000
ai.temperature=0.4

# ---- 识图增强 ----
# 两段式识别：先把图片转写成文字（公式用 LaTeX），再交给文字模型结构化
# 关闭后回到"一次识图直出 JSON"的旧路径
ai.ocr.twoStage=true
# 识图前的图片预处理：EXIF 方向纠正、分辨率归一化、超长图切带（设置页可关）
ai.ocr.preprocess=true
# 视觉模型参数：复杂公式题需要更长的输出与上下文
ai.vision.maxTokens=3000
ai.vision.numCtx=8192
ai.vision.temperature=0.1

# ============ 联网校验（上传错题识别后的可信度核对） ============
# 服务端总开关；前端上传页另有「识别后联网校验」开关，两级都开才会请求
ai.search.enabled=true
# 每次检索保留的条数
ai.search.topN=5

# ---- 默认档：Bing RSS + 搜狗网页，免 Key ----
ai.search.default.maxChars=1500
ai.search.default.timeoutMs=4000

# ---- AnySearch 档：前端填写 Key，服务端也可留一个兜底 Key ----
ai.search.anysearch.baseUrl=https://api.anysearch.com/v1
ai.search.anysearch.maxChars=2500
ai.search.anysearch.timeoutMs=8000
# 留空则由前端填写；前端填了就用前端的
ai.search.anysearch.apiKey=

# ---- 结果缓存：同一题干重复识别不重复抓取 ----
ai.search.cache.size=50
ai.search.cache.ttlMinutes=1440
